<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">药店管理系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #2c3e50;
            color: white;
        }
        .sidebar a {
            color: #ecf0f1;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
        }
        .sidebar a:hover {
            background: #34495e;
        }
        .sidebar a.active {
            background: #3498db;
        }
        .content {
            padding: 20px;
        }
        .navbar-brand {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <h4 class="text-center py-4">🏥 药店管理系统</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a th:href="@{/drugs}" class="nav-link">
                                <i class="bi bi-capsule"></i> 药品信息管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/inventory}" class="nav-link">
                                <i class="bi bi-box-seam"></i> 库存管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/sales}" class="nav-link">
                                <i class="bi bi-cart3"></i> 销售与查询
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto content">
                <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded">
                    <div class="container-fluid">
                        <span class="navbar-brand mb-0 h1" th:text="${title}">管理系统</span>
                    </div>
                </nav>

                <div th:replace="~{${content}}"></div>
            </main>
        </div>
    </div>

    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
