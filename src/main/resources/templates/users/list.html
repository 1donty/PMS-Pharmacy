<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 药店管理系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .sidebar { min-height: 100vh; background: #2c3e50; color: white; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 15px 20px; display: block; }
        .sidebar a:hover { background: #34495e; }
        .sidebar a.active { background: #3498db; }
        .content { padding: 20px; }
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <h4 class="text-center py-4">🏥 药店管理系统</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item"><a th:href="@{/drugs}" class="nav-link"><i class="bi bi-capsule"></i> 药品信息管理</a></li>
                        <li class="nav-item"><a th:href="@{/inventory}" class="nav-link"><i class="bi bi-box-seam"></i> 库存管理</a></li>
                        <li class="nav-item"><a th:href="@{/sales}" class="nav-link"><i class="bi bi-cart3"></i> 销售与查询</a></li>
                        <li class="nav-item"><a th:href="@{/users}" class="nav-link active"><i class="bi bi-users"></i> 用户管理</a></li>
                        <li class="nav-item"><a th:href="@{/roles}" class="nav-link"><i class="bi bi-shield"></i> 角色管理</a></li>
                        <li class="nav-item"><a th:href="@{/menus}" class="nav-link"><i class="bi bi-list"></i> 菜单管理</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto content">
                <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded">
                    <div class="container-fluid">
                        <span class="navbar-brand mb-0 h1">用户管理</span>
                    </div>
                </nav>

                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">用户列表</h5>
                        <a th:href="@{/users/new}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> 添加用户</a>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                                <tr><th>ID</th><th>用户名</th><th>姓名</th><th>邮箱</th><th>电话</th><th>状态</th><th>角色</th><th>操作</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.id}"></td>
                                    <td th:text="${user.username}"></td>
                                    <td th:text="${user.realName}"></td>
                                    <td th:text="${user.email}"></td>
                                    <td th:text="${user.phone}"></td>
                                    <td><span th:if="${user.enabled}" class="badge bg-success">启用</span><span th:unless="${user.enabled}" class="badge bg-danger">禁用</span></td>
                                    <td>
                                        <span th:each="role, iterStat : ${user.roles}">
                                            <span th:text="${role.name}"></span><span th:if="${!iterStat.last}">, </span>
                                        </span>
                                    </td>
                                    <td>
                                        <a th:href="@{/users/{id}/edit(id=${user.id})}" class="btn btn-sm btn-warning">编辑</a>
                                        <a th:href="@{/users/{id}/delete(id=${user.id})}" class="btn btn-sm btn-danger" onclick="return confirm('确定删除该用户吗？')">删除</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div th:if="${#lists.isEmpty(users)}" class="text-center py-4">
                            <p class="text-muted">暂无用户</p>
                            <a th:href="@{/users/new}" class="btn btn-primary">添加第一个用户</a>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
