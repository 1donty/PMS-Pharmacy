<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加/编辑角色 - 药店管理系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .sidebar { min-height: 100vh; background: #2c3e50; color: white; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 15px 20px; display: block; }
        .sidebar a:hover { background: #34495e; }
        .sidebar a.active { background: #3498db; }
        .content { padding: 20px; }
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <h4 class="text-center py-4">🏥 药店管理系统</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item"><a th:href="@{/drugs}" class="nav-link"><i class="bi bi-capsule"></i> 药品信息管理</a></li>
                        <li class="nav-item"><a th:href="@{/inventory}" class="nav-link"><i class="bi bi-box-seam"></i> 库存管理</a></li>
                        <li class="nav-item"><a th:href="@{/sales}" class="nav-link"><i class="bi bi-cart3"></i> 销售与查询</a></li>
                        <li class="nav-item"><a th:href="@{/users}" class="nav-link"><i class="bi bi-users"></i> 用户管理</a></li>
                        <li class="nav-item"><a th:href="@{/roles}" class="nav-link active"><i class="bi bi-shield"></i> 角色管理</a></li>
                        <li class="nav-item"><a th:href="@{/menus}" class="nav-link"><i class="bi bi-list"></i> 菜单管理</a></li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto content">
                <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded">
                    <div class="container-fluid">
                        <span class="navbar-brand mb-0 h1">角色管理</span>
                    </div>
                </nav>

                <div class="card">
                    <div class="card-header"><h5 th:text="${role.id == null ? '添加角色' : '编辑角色'}"></h5></div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        <form th:action="${role.id == null ? '/roles' : '/roles/' + role.id}" th:object="${role}" method="post">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">角色名称 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{name}" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">角色编码</label>
                                    <input type="text" th:field="*{code}" class="form-control">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">描述</label>
                                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">菜单权限</label>
                                <div class="row">
                                    <div th:each="menu : ${menus}" class="col-md-3">
                                        <div class="form-check">
                                            <input type="checkbox" th:field="*{menus}" th:value="${menu.id}" class="form-check-input">
                                            <label class="form-check-label" th:text="${menu.name}"></label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/roles}" class="btn btn-secondary">取消</a>
                                <button type="submit" class="btn btn-primary">保存</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
