<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售与查询 - 药店管理系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #2c3e50;
            color: white;
        }
        .sidebar a {
            color: #ecf0f1;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
        }
        .sidebar a:hover {
            background: #34495e;
        }
        .sidebar a.active {
            background: #3498db;
        }
        .content {
            padding: 20px;
        }
        .navbar-brand {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <h4 class="text-center py-4">🏥 药店管理系统</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a th:href="@{/drugs}" class="nav-link">
                                <i class="bi bi-capsule"></i> 药品信息管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/inventory}" class="nav-link">
                                <i class="bi bi-box-seam"></i> 库存管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/sales}" class="nav-link active">
                                <i class="bi bi-cart3"></i> 销售与查询
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto content">
                <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded">
                    <div class="container-fluid">
                        <span class="navbar-brand mb-0 h1">销售与查询</span>
                    </div>
                </nav>

                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">销售记录</h5>
                        <div>
                            <a th:href="@{/sales/new}" class="btn btn-primary">
                                <i class="bi bi-cart-plus"></i> 新建销售
                            </a>
                            <a th:href="@{/sales/recent}" class="btn btn-info">
                                <i class="bi bi-clock-history"></i> 最近销售
                            </a>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <form th:action="@{/sales/search}" method="get" class="d-flex">
                                    <input type="text" name="customerName" placeholder="按客户名称搜索..." class="form-control">
                                    <button type="submit" class="btn btn-outline-primary ms-2">搜索</button>
                                </form>
                            </div>
                            <div class="col-md-6">
                                <form th:action="@{/sales/date-range}" method="get" class="row g-2">
                                    <div class="col-auto">
                                        <input type="datetime-local" name="startDate" class="form-control" required>
                                    </div>
                                    <div class="col-auto">
                                        <input type="datetime-local" name="endDate" class="form-control" required>
                                    </div>
                                    <div class="col-auto">
                                        <button type="submit" class="btn btn-outline-success">按日期查询</button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <div th:if="${totalAmount}" class="alert alert-success">
                            <strong>该时间段总销售额:</strong> ¥<span th:text="${#numbers.formatDecimal(totalAmount, 1, 2)}"></span>
                        </div>

                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>销售日期</th>
                                    <th>药品名称</th>
                                    <th>药品编码</th>
                                    <th>数量</th>
                                    <th>单价</th>
                                    <th>总金额</th>
                                    <th>客户名称</th>
                                    <th>支付方式</th>
                                    <th>备注</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="sale : ${sales}">
                                    <td th:text="${sale.id}"></td>
                                    <td th:text="${#temporals.format(sale.saleDate, 'yyyy-MM-dd HH:mm')}"></td>
                                    <td th:text="${sale.drug.name}"></td>
                                    <td th:text="${sale.drug.drugCode}"></td>
                                    <td th:text="${sale.quantity}"></td>
                                    <td th:text="${'¥' + sale.unitPrice}"></td>
                                    <td th:text="${'¥' + sale.totalAmount}"></td>
                                    <td th:text="${sale.customerName}"></td>
                                    <td th:text="${sale.paymentMethod}"></td>
                                    <td th:text="${sale.remarks}"></td>
                                    <td>
                                        <a th:href="@{/sales/{id}/delete(id=${sale.id})}" class="btn btn-sm btn-danger"
                                           onclick="return confirm('确定删除该销售记录吗？')">删除</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <div th:if="${#lists.isEmpty(sales)}" class="text-center py-4">
                            <p class="text-muted">暂无销售记录</p>
                            <a th:href="@{/sales/new}" class="btn btn-primary">创建第一个销售记录</a>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
