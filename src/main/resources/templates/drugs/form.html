<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加/编辑药品 - 药店管理系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #2c3e50;
            color: white;
        }
        .sidebar a {
            color: #ecf0f1;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
        }
        .sidebar a:hover {
            background: #34495e;
        }
        .sidebar a.active {
            background: #3498db;
        }
        .content {
            padding: 20px;
        }
        .navbar-brand {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <h4 class="text-center py-4">🏥 药店管理系统</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a th:href="@{/drugs}" class="nav-link">
                                <i class="bi bi-capsule"></i> 药品信息管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/inventory}" class="nav-link">
                                <i class="bi bi-box-seam"></i> 库存管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/sales}" class="nav-link">
                                <i class="bi bi-cart3"></i> 销售与查询
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto content">
                <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded">
                    <div class="container-fluid">
                        <span class="navbar-brand mb-0 h1">药品信息管理</span>
                    </div>
                </nav>

                <div class="card">
                    <div class="card-header">
                        <h5 th:text="${drug.id == null ? '添加药品' : '编辑药品'}"></h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                        <form th:action="${drug.id == null ? '/drugs' : '/drugs/' + drug.id}" th:object="${drug}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">药品编码 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{drugCode}" class="form-control" required>
                                    <small th:if="${#fields.hasErrors('drugCode')}" class="text-danger" th:errors="*{drugCode}"></small>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">药品名称 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{name}" class="form-control" required>
                                    <small th:if="${#fields.hasErrors('name')}" class="text-danger" th:errors="*{name}"></small>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">规格 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{specification}" class="form-control" required>
                                    <small th:if="${#fields.hasErrors('specification')}" class="text-danger" th:errors="*{specification}"></small>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">生产企业 <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{manufacturer}" class="form-control" required>
                                    <small th:if="${#fields.hasErrors('manufacturer')}" class="text-danger" th:errors="*{manufacturer}"></small>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label class="form-label">单价(元) <span class="text-danger">*</span></label>
                                    <input type="number" step="0.01" min="0" th:field="*{price}" class="form-control" required>
                                    <small th:if="${#fields.hasErrors('price')}" class="text-danger" th:errors="*{price}"></small>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">类别</label>
                                    <select th:field="*{category}" class="form-select">
                                        <option value="">请选择</option>
                                        <option value="西药">西药</option>
                                        <option value="中成药">中成药</option>
                                        <option value="中药材">中药材</option>
                                        <option value="保健品">保健品</option>
                                        <option value="医疗器械">医疗器械</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">单位</label>
                                    <input type="text" th:field="*{unit}" class="form-control" placeholder="如：盒、瓶、板">
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="form-check">
                                    <input type="checkbox" th:field="*{prescriptionRequired}" class="form-check-input" id="prescriptionRequired">
                                    <label class="form-check-label" for="prescriptionRequired">
                                        需要处方
                                    </label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">说明</label>
                                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/drugs}" class="btn btn-secondary">取消</a>
                                <button type="submit" class="btn btn-primary">保存</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
