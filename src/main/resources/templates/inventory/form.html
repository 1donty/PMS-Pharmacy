<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加/编辑库存 - 药店管理系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #2c3e50;
            color: white;
        }
        .sidebar a {
            color: #ecf0f1;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
        }
        .sidebar a:hover {
            background: #34495e;
        }
        .sidebar a.active {
            background: #3498db;
        }
        .content {
            padding: 20px;
        }
        .navbar-brand {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <h4 class="text-center py-4">🏥 药店管理系统</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a th:href="@{/drugs}" class="nav-link">
                                <i class="bi bi-capsule"></i> 药品信息管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/inventory}" class="nav-link active">
                                <i class="bi bi-box-seam"></i> 库存管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/sales}" class="nav-link">
                                <i class="bi bi-cart3"></i> 销售与查询
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto content">
                <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded">
                    <div class="container-fluid">
                        <span class="navbar-brand mb-0 h1">库存管理</span>
                    </div>
                </nav>

                <div class="card">
                    <div class="card-header">
                        <h5 th:text="${inventory.id == null ? '添加库存' : '编辑库存'}"></h5>
                    </div>
                    <div class="card-body">
                        <form th:action="${inventory.id == null ? '/inventory' : '/inventory/' + inventory.id}" th:object="${inventory}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="row mb-3">
                                <div class="col-md-6" th:if="${inventory.id == null}">
                                    <label class="form-label">药品 <span class="text-danger">*</span></label>
                                    <select name="drugId" class="form-select" required>
                                        <option value="">请选择药品</option>
                                        <option th:each="drug : ${drugs}" th:value="${drug.id}" th:text="${drug.name + ' (' + drug.drugCode + ')'}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6" th:unless="${inventory.id == null}">
                                    <label class="form-label">药品</label>
                                    <input type="text" th:value="${inventory.drug.name}" class="form-control" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">库存数量 <span class="text-danger">*</span></label>
                                    <input type="number" min="0" th:field="*{quantity}" class="form-control" required>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">警戒库存</label>
                                    <input type="number" min="0" th:field="*{alertQuantity}" class="form-control" placeholder="低于此数量将触发警告">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">批号</label>
                                    <input type="text" th:field="*{batchNumber}" class="form-control">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">生产日期</label>
                                    <input type="date" th:field="*{productionDate}" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">有效期至</label>
                                    <input type="date" th:field="*{expiryDate}" class="form-control">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">供应商</label>
                                <input type="text" th:field="*{supplier}" class="form-control">
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/inventory}" class="btn btn-secondary">取消</a>
                                <button type="submit" class="btn btn-primary">保存</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
