<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>库存管理 - 药店管理系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #2c3e50;
            color: white;
        }
        .sidebar a {
            color: #ecf0f1;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
        }
        .sidebar a:hover {
            background: #34495e;
        }
        .sidebar a.active {
            background: #3498db;
        }
        .content {
            padding: 20px;
        }
        .navbar-brand {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <h4 class="text-center py-4">🏥 药店管理系统</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a th:href="@{/drugs}" class="nav-link">
                                <i class="bi bi-capsule"></i> 药品信息管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/inventory}" class="nav-link active">
                                <i class="bi bi-box-seam"></i> 库存管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/sales}" class="nav-link">
                                <i class="bi bi-cart3"></i> 销售与查询
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto content">
                <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded">
                    <div class="container-fluid">
                        <span class="navbar-brand mb-0 h1">库存管理</span>
                    </div>
                </nav>

                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">库存列表</h5>
                        <div>
                            <a th:href="@{/inventory/new}" class="btn btn-primary">
                                <i class="bi bi-plus-circle"></i> 添加库存
                            </a>
                            <a th:href="@{/inventory/expiring}" class="btn btn-danger">
                                <i class="bi bi-clock"></i> 即将过期
                            </a>
                        </div>
                    </div>
                    <div class="card-body">
                        <div th:if="${alert}" class="alert alert-warning">
                            <i class="bi bi-exclamation-circle"></i> <span th:text="${alert}"></span>
                        </div>

                        <table class="table table-striped table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>药品名称</th>
                                    <th>药品编码</th>
                                    <th>库存数量</th>
                                    <th>批号</th>
                                    <th>有效期</th>
                                    <th>供应商</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="inv : ${inventoryList}">
                                    <td th:text="${inv.id}"></td>
                                    <td th:text="${inv.drug.name}"></td>
                                    <td th:text="${inv.drug.drugCode}"></td>
                                    <td>
                                        <span th:class="${inv.isExpired() ? 'text-danger fw-bold' : ''}" th:text="${inv.quantity}"></span>
                                    </td>
                                    <td th:text="${inv.batchNumber}"></td>
                                    <td th:text="${#temporals.format(inv.expiryDate, 'yyyy-MM-dd')}"></td>
                                    <td th:text="${inv.supplier}"></td>
                                    <td>
                                        <span th:if="${inv.isExpired()}" class="badge bg-danger">已过期</span>
                                        <span th:else class="badge bg-success">正常</span>
                                    </td>
                                    <td>
                                        <a th:href="@{/inventory/{id}/edit(id=${inv.id})}" class="btn btn-sm btn-warning">编辑</a>
                                        <a th:href="@{/inventory/{id}/adjust(id=${inv.id})}" class="btn btn-sm btn-info">调整</a>
                                        <a th:href="@{/inventory/{id}/delete(id=${inv.id})}" class="btn btn-sm btn-danger"
                                           onclick="return confirm('确定删除该库存记录吗？')">删除</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <div th:if="${#lists.isEmpty(inventoryList)}" class="text-center py-4">
                            <p class="text-muted">暂无库存记录</p>
                            <a th:href="@{/inventory/new}" class="btn btn-primary">添加第一条库存记录</a>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
