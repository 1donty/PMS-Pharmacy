<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调整库存 - 药店管理系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #2c3e50;
            color: white;
        }
        .sidebar a {
            color: #ecf0f1;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
        }
        .sidebar a:hover {
            background: #34495e;
        }
        .sidebar a.active {
            background: #3498db;
        }
        .content {
            padding: 20px;
        }
        .navbar-brand {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block sidebar">
                <div class="position-sticky">
                    <h4 class="text-center py-4">🏥 药店管理系统</h4>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a th:href="@{/drugs}" class="nav-link">
                                <i class="bi bi-capsule"></i> 药品信息管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/inventory}" class="nav-link active">
                                <i class="bi bi-box-seam"></i> 库存管理
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/sales}" class="nav-link">
                                <i class="bi bi-cart3"></i> 销售与查询
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto content">
                <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded">
                    <div class="container-fluid">
                        <span class="navbar-brand mb-0 h1">库存管理</span>
                    </div>
                </nav>

                <div class="card">
                    <div class="card-header">
                        <h5>调整库存</h5>
                    </div>
                    <div class="card-body">
                        <div class="alert alert-info">
                            <strong>药品:</strong> <span th:text="${inventory.drug.name}"></span><br>
                            <strong>当前库存:</strong> <span th:text="${inventory.quantity}"></span> <span th:text="${inventory.drug.unit}"></span><br>
                            <strong>警戒库存:</strong> <span th:text="${inventory.alertQuantity}"></span>
                        </div>

                        <form th:action="@{/inventory/{id}/adjust(id=${inventory.id})}" method="post">
                            <div class="mb-3">
                                <label class="form-label">调整数量</label>
                                <input type="number" name="adjustment" class="form-control" required>
                                <small class="text-muted">正数表示增加库存，负数表示减少库存</small>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/inventory}" class="btn btn-secondary">取消</a>
                                <button type="submit" class="btn btn-primary">确认调整</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
