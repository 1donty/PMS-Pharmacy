<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 药店管理系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}">
    <style>
        body { background-color: #f5f5f5; }
        .login-container { max-width: 400px; margin-top: 100px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container mx-auto">
            <div class="card">
                <div class="card-header text-center">
                    <h4 class="text-primary">🏥 药店管理系统</h4>
                </div>
                <div class="card-body">
                    <div th:if="${loginError}" class="alert alert-danger">
                        用户名或密码错误，请重试
                    </div>
                    <div th:if="${loginLogout}" class="alert alert-success">
                        您已成功退出登录
                    </div>
                    <div th:if="${loginRegistered}" class="alert alert-success">
                        注册成功！请登录
                    </div>
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">登录</button>
                    </form>
                    <div class="mt-3 text-center">
                        <a th:href="@{/register}">还没有账号？立即注册</a>
                    </div>
                </div>
                <div class="card-footer text-center text-muted">
                    管理员账号：admin | 普通用户账号：user
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
